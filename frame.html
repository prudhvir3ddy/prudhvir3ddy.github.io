<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Frame Utility</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #2c3e50;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            animation: fadeIn 0.8s ease-out;
        }

        .main-content {
            display: flex;
            gap: 50px;
            align-items: flex-start;
            margin-top: 40px;
        }

        .left-section {
            flex: 1;
            max-width: 500px;
            background: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .right-section {
            flex: 1;
            position: sticky;
            top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        
        h1 {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;

        }

        .subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-weight: 400;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: -1px;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .upload-section {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        
        .drop-zone {
            width: 100%;
            height: 250px;
            margin: 0 auto 20px;
            border: 3px dashed #e0e0e0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(106, 17, 203, 0.05) 0%, rgba(37, 117, 252, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drop-zone:hover::before {
            opacity: 1;
        }

        .drop-zone:hover {
            border-color: #6a11cb;
            transform: translateY(-2px);
        }

        .drop-zone.dragover {
            border-color: #6a11cb;
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 64px;
            color: #6a11cb;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .drop-zone-icon {
            transform: scale(1.1);
        }

        .drop-zone-text {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .drop-zone-subtext {
            font-size: 14px;
            color: #666;
        }

        .or-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            color: #666;
            position: relative;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
            margin: 0 15px;
        }
        
        .frame-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }
        
        .frame-option {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .frame-option:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .frame-option.selected {
            box-shadow: 0 0 20px rgba(106, 17, 203, 0.5);
            animation: pulse 2s infinite;
        }
        
        .preview-section {
            text-align: center;
            animation: fadeIn 0.8s ease-out 0.6s both;
            background: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            position: relative;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .preview-section.empty {
            background: transparent;
            border: none;
            border-radius: 0;
        }

        .frame-preview {
            padding: 16px;
            position: relative;
            border-radius: 16px;
            overflow: visible;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: scaleIn 0.5s ease-out;
            background: transparent;
            display: inline-block;
        }

        #imagePreview {
            display: none;
            max-width: none;
            max-height: none;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .preview-placeholder {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.3);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .upload-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .upload-btn:hover::before {
            opacity: 1;
        }
        
        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 117, 252, 0.4);
        }
        
        .random-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .random-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .random-btn:hover::before {
            opacity: 1;
        }

        .random-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
                gap: 30px;
            }

            .left-section {
                max-width: 100%;
            }

            .right-section {
                position: static;
            }

            .preview-section {
                margin-top: 20px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .drop-zone {
                height: 200px;
            }

            .frame-options {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 10px;
            }

            .button-group {
                flex-direction: column;
                gap: 15px;
            }

            .random-btn {
                margin-left: 0;
            }

            #imagePreview {
                max-width: 100vw;
                height: auto;
            }
        }

        /* Update frame styles to be consistent */
        .frame-preview.red-frame,
        .frame-preview.blue-frame,
        .frame-preview.green-frame,
        .frame-preview.purple-frame,
        .frame-preview.orange-frame,
        .frame-preview.pink-frame,
        .frame-preview.gradient-frame {
            padding: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* Update frame option images to be consistent */
        .frame-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        /* Add hover effect to preview section */
        .preview-section:hover .frame-preview {
            transform: scale(1.02);
        }

        /* Update loading animation */
        .loading {
            position: relative;
            overflow: hidden;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .frame-preview.red-frame {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
        }

        .frame-preview.blue-frame {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .frame-preview.green-frame {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }

        .frame-preview.yellow-frame {
            background: linear-gradient(135deg, #ffd700, #ffa500);
        }

        .frame-preview.purple-frame,
        .frame-preview.pink-frame,
        .frame-preview.orange-frame {
            padding: 16px;
            position: relative;
            border-radius: 16px;
            overflow: visible;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: scaleIn 0.5s ease-out;
            display: inline-block;
        }

        .frame-preview.purple-frame {
            background: linear-gradient(135deg, #9c55d4, #b78de7);
        }

        .frame-preview.pink-frame {
            background: linear-gradient(135deg, #ff6b9c, #ff9dbc);
        }

        .frame-preview.orange-frame {
            background: linear-gradient(135deg, #ff9147, #ffb47d);
        }

        .frame-preview.purple-frame img,
        .frame-preview.pink-frame img,
        .frame-preview.orange-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .frame-preview.teal-frame {
            background: linear-gradient(135deg, #20c997, #4ddbc4);
        }

        .frame-preview.gradient-frame {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 25%, #00c6ff 50%, #0072ff 75%, #00c6ff 100%);
        }

        /* Add similar ::before and ::after styles for new frames */
        .frame-preview.purple-frame::before,
        .frame-preview.purple-frame::after,
        .frame-preview.orange-frame::before,
        .frame-preview.orange-frame::after,
        .frame-preview.pink-frame::before,
        .frame-preview.pink-frame::after,
        .frame-preview.gradient-frame::before,
        .frame-preview.gradient-frame::after {
            content: '';
            position: absolute;
            height: 16px;
            left: 0;
            right: 0;
        }

        .frame-preview.purple-frame::before,
        .frame-preview.purple-frame::after {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 25%, #6a11cb 50%, #2575fc 75%, #6a11cb 100%);
        }

        .frame-preview.orange-frame::before,
        .frame-preview.orange-frame::after {
            background: linear-gradient(135deg, #ff9a44 0%, #fc6076 25%, #ff9a44 50%, #fc6076 75%, #ff9a44 100%);
        }

        .frame-preview.pink-frame::before,
        .frame-preview.pink-frame::after {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 25%, #ffb3b3 50%, #ff8e8e 75%, #ff6b6b 100%);
        }

        .frame-preview.gradient-frame::before,
        .frame-preview.gradient-frame::after {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 25%, #00c6ff 50%, #0072ff 75%, #00c6ff 100%);
        }

        .download-btn {
            background: #6a11cb 0%;
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.3);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            margin: 20px auto;
            display: none;
            width: fit-content;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .download-btn:hover::before {
            opacity: 1;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(106, 17, 203, 0.4);
        }

        .footer {
            text-align: center;
            padding: 20px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            color: #666;
            font-size: 14px;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }

        .footer a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #2575fc;
        }

        .frame-preview.cyan-frame {
            background: linear-gradient(135deg, #00e5ff, #4eeefd);
        }

        .frame-preview.lime-frame {
            background: linear-gradient(135deg, #a8e048, #c6e99c);
        }

        .frame-preview.coral-frame {
            background: linear-gradient(135deg, #ff7e67, #ffac9c);
        }

        .custom-color-section {
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            border-top: 1px solid #eee;
        }

        .custom-color-label {
            display: block;
            margin-bottom: 10px;
            color: #666;
            font-size: 0.9rem;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .color-picker {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 50px;
            height: 50px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .color-picker:hover {
            transform: scale(1.1);
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .color-picker::-moz-color-swatch {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .frame-preview.custom-frame {
            background: linear-gradient(135deg, var(--custom-color-1, #ff6b6b), var(--custom-color-2, #ff8e8e));
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> 🖼️ Social Media Frame Studio 🎨</h1>
        <div class="subtitle">Make your posts stand out with beautiful frames ✨</div> 
        
        <div class="main-content">
            <div class="left-section">
                <div class="upload-section">
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-zone-icon">📁</div>
                        <div class="drop-zone-text">Drag & Drop your image here</div>
                        <div class="drop-zone-subtext">or click to browse files</div>
                    </div>

                    <div class="button-group">
                        <button class="random-btn" onclick="selectRandomFrame()">Random Frame</button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>
                
                <div class="frame-options">
                    <div class="frame-option" data-frame="none" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2VlZSIvPjwvc3ZnPg==" alt="No Frame">
                    </div>
                    <div class="frame-option" data-frame="red" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmNmI2YiIvPjwvc3ZnPg==" alt="Red Frame">
                    </div>
                    <div class="frame-option" data-frame="blue" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzRmYWNmZSIvPjwvc3ZnPg==" alt="Blue Frame">
                    </div>
                    <div class="frame-option" data-frame="green" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzQzZTk3YiIvPjwvc3ZnPg==" alt="Green Frame">
                    </div>
                    <div class="frame-option" data-frame="yellow" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZDcwMCIvPjwvc3ZnPg==" alt="Yellow Frame">
                    </div>
                    <div class="frame-option" data-frame="cyan" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzAwZTVmZiIvPjwvc3ZnPg==" alt="Cyan Frame">
                    </div>
                    <div class="frame-option" data-frame="lime" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2E4ZTA0OCIvPjwvc3ZnPg==" alt="Lime Frame">
                    </div>
                    <div class="frame-option" data-frame="coral" onclick="selectFrame(this)">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmN2U2NyIvPjwvc3ZnPg==" alt="Coral Frame">
                    </div>
                </div>
                <div class="custom-color-section">
                    <span class="custom-color-label">Create your own frame color</span>
                    <div class="color-picker-container">
                        <input type="color" id="colorPicker1" class="color-picker" value="#ff6b6b" oninput="updateCustomColor()">
                        <input type="color" id="colorPicker2" class="color-picker" value="#ff8e8e" oninput="updateCustomColor()">
                    </div>
                </div>
            </div>

            <div class="right-section">
                <div class="preview-section">
                    <div class="frame-preview" id="framePreview">
                        <img id="imagePreview" alt="Preview">
                    </div>
                </div>
                <button class="download-btn" id="downloadBtn" onclick="downloadImage()">
                    Download Image
                </button>
            </div>
        </div>
    </div>

    <footer class="footer">
        Built with ❤️ by <a href="https://github.com/prudhvir3ddy" target="_blank">prudhvir3ddy</a>
    </footer>

    <script>
        let selectedFrame = 'none';
        let uploadedImage = null;

        // Add drag and drop functionality
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    const framePreview = document.getElementById('framePreview');
                    const previewSection = document.querySelector('.preview-section');
                    const downloadBtn = document.getElementById('downloadBtn');
                    framePreview.classList.add('loading');
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.getElementById('imagePreview');
                        img.src = e.target.result;
                        img.style.display = 'block';
                        uploadedImage = img;
                        applyFrame();
                        downloadBtn.style.display = 'block';
                        
                        img.onload = function() {
                            framePreview.classList.remove('loading');
                        };
                    }
                    reader.readAsDataURL(file);
                } else {
                    alert('Please upload an image file.');
                }
            }
        }

        // Update existing file input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            handleFiles(e.target.files);
        });

        function selectFrame(element) {
            document.querySelectorAll('.frame-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            selectedFrame = element.dataset.frame;
            applyFrame();
        }

        function selectRandomFrame() {
            const frames = ['red', 'blue', 'green', 'yellow', 'cyan', 'lime', 'coral'];
            const currentFrame = document.querySelector('.frame-option.selected')?.dataset.frame;
            let availableFrames = frames.filter(frame => frame !== currentFrame);
            
            if (availableFrames.length === 0) {
                availableFrames = frames;
            }
            
            const randomFrame = availableFrames[Math.floor(Math.random() * availableFrames.length)];
            const frameElement = document.querySelector(`[data-frame="${randomFrame}"]`);
            selectFrame(frameElement);
        }

        function applyFrame() {
            if (!uploadedImage) return;
            
            const framePreview = document.getElementById('framePreview');
            framePreview.className = 'frame-preview';
            
            switch(selectedFrame) {
                case 'red':
                    framePreview.classList.add('red-frame');
                    break;
                case 'blue':
                    framePreview.classList.add('blue-frame');
                    break;
                case 'green':
                    framePreview.classList.add('green-frame');
                    break;
                case 'yellow':
                    framePreview.classList.add('yellow-frame');
                    break;
                case 'cyan':
                    framePreview.classList.add('cyan-frame');
                    break;
                case 'lime':
                    framePreview.classList.add('lime-frame');
                    break;
                case 'coral':
                    framePreview.classList.add('coral-frame');
                    break;
                case 'custom':
                    framePreview.classList.add('custom-frame');
                    break;
                default:
                    framePreview.className = 'frame-preview';
            }
        }

        function downloadImage() {
            if (!uploadedImage) return;

            const framePreview = document.getElementById('framePreview');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Set canvas size to match the frame preview
            canvas.width = framePreview.offsetWidth;
            canvas.height = framePreview.offsetHeight;

            // Get the frame class to determine the gradient
            const frameClass = framePreview.className.split(' ').find(cls => cls.includes('-frame'));
            let gradient;
            
            // Set the appropriate gradient based on the frame class
            switch(frameClass) {
                case 'red-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#ff6b6b');
                    gradient.addColorStop(1, '#ff8e8e');
                    break;
                case 'blue-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#4facfe');
                    gradient.addColorStop(1, '#00f2fe');
                    break;
                case 'green-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#43e97b');
                    gradient.addColorStop(1, '#38f9d7');
                    break;
                case 'yellow-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#ffd700');
                    gradient.addColorStop(1, '#ffa500');
                    break;
                case 'cyan-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#00e5ff');
                    gradient.addColorStop(1, '#4eeefd');
                    break;
                case 'lime-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#a8e048');
                    gradient.addColorStop(1, '#c6e99c');
                    break;
                case 'coral-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#ff7e67');
                    gradient.addColorStop(1, '#ffac9c');
                    break;
                case 'custom-frame':
                    gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, getComputedStyle(document.documentElement).getPropertyValue('--custom-color-1').trim());
                    gradient.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--custom-color-2').trim());
                    break;
                default:
                    gradient = '#ffffff';
            }

            // Draw the frame background
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate image position to maintain aspect ratio
            const imgWidth = uploadedImage.naturalWidth;
            const imgHeight = uploadedImage.naturalHeight;
            const framePadding = 16; // Match the frame padding
            const maxWidth = canvas.width - (framePadding * 2);
            const maxHeight = canvas.height - (framePadding * 2);
            
            let width = imgWidth;
            let height = imgHeight;
            
            if (width > maxWidth) {
                const ratio = maxWidth / width;
                width *= ratio;
                height *= ratio;
            }
            
            if (height > maxHeight) {
                const ratio = maxHeight / height;
                width *= ratio;
                height *= ratio;
            }
            
            const x = (canvas.width - width) / 2;
            const y = (canvas.height - height) / 2;

            // Draw the image
            ctx.drawImage(uploadedImage, x, y, width, height);

            // Convert to blob and download
            canvas.toBlob(function(blob) {
                const link = document.createElement('a');
                link.download = 'framed-image.png';
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
            }, 'image/png', 1.0); // Maximum quality
        }

        function updateCustomColor() {
            const color1 = document.getElementById('colorPicker1').value;
            const color2 = document.getElementById('colorPicker2').value;
            document.documentElement.style.setProperty('--custom-color-1', color1);
            document.documentElement.style.setProperty('--custom-color-2', color2);
            
            // Deselect any selected frame option
            document.querySelectorAll('.frame-option').forEach(opt => opt.classList.remove('selected'));
            
            selectedFrame = 'custom';
            applyFrame();
        }
    </script>
</body>
