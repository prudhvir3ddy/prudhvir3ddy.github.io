<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website to Mobile App Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(88, 86, 214, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%);
            z-index: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(45deg, #5856d6, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }

        .header p {
            color: #a0aec0;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 8px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 8px;
            padding: 1px;
            background: linear-gradient(45deg, rgba(88, 86, 214, 0.5), rgba(255, 107, 107, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #a0aec0;
        }
        
        input {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #5856d6;
            box-shadow: 0 0 0 2px rgba(88, 86, 214, 0.2);
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #5856d6, #ff6b6b);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        button:hover::before {
            transform: translateX(0);
        }
        
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinning-circle {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #5856d6;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            padding: 12px;
            border-radius: 6px;
        }
        
        .success {
            background-color: rgba(47, 133, 90, 0.1);
            color: #48bb78;
            border: 1px solid rgba(72, 187, 120, 0.2);
        }
        
        .error {
            background-color: rgba(197, 48, 48, 0.1);
            color: #f56565;
            border: 1px solid rgba(245, 101, 101, 0.2);
        }

        .visualization {
            margin-top: 60px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .visualization::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 8px;
            padding: 1px;
            background: linear-gradient(45deg, rgba(88, 86, 214, 0.5), rgba(255, 107, 107, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .process-flow {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px 0;
            gap: 20px;
        }

        .process-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            min-width: 100px;
        }

        .step-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #5856d6, #ff6b6b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-bottom: 8px;
            position: relative;
            animation: pulse 2s infinite;
        }

        .step-label {
            color: #a0aec0;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            max-width: 100px;
            word-wrap: break-word;
        }

        .connecting-line {
            display: none;
        }

        .floating-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(45deg, #5856d6, #ff6b6b);
            border-radius: 50%;
            animation: float 4s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes flow {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { transform: translateY(-20px) translateX(10px); opacity: 1; }
            100% { transform: translateY(-40px) translateX(20px); opacity: 0; }
        }

        .visualization-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(45deg, #5856d6, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @media (min-width: 768px) {
            .visualization {
                padding: 40px;
            }

            .process-flow {
                flex-wrap: nowrap;
                justify-content: space-between;
                gap: 0;
            }

            .process-step {
                min-width: auto;
            }

            .step-icon {
                width: 60px;
                height: 60px;
                font-size: 24px;
                margin-bottom: 10px;
            }

            .step-label {
                font-size: 14px;
                max-width: none;
            }

            .connecting-line {
                display: block;
                position: absolute;
                top: 30px;
                left: 15%;
                right: 15%;
                height: 2px;
                background: linear-gradient(90deg, 
                    transparent 0%, 
                    rgba(88, 86, 214, 0.5) 20%, 
                    rgba(255, 107, 107, 0.5) 80%, 
                    transparent 100%
                );
                animation: flow 3s linear infinite;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Convert Website to Mobile App APK</h1>
        <p>Transform your website into a native Android application with just a few clicks</p>
    </div>

    <div class="container">
        <form id="convertForm">
            <div class="form-group">
                <label for="url">Website URL</label>
                <input 
                    type="url" 
                    id="url" 
                    name="url" 
                    placeholder="https://example.com" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="packageName">App Package Name</label>
                <input 
                    type="text" 
                    id="packageName" 
                    name="packageName" 
                    placeholder="com.example.app" 
                    pattern="[a-z][a-z0-9_]*(\.[a-z0-9_]+)+" 
                    title="Package name should be in format: com.example.app"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="secret">Secret</label>
                <input 
                    type="password" 
                    id="secret" 
                    name="secret" 
                    placeholder="Enter secret key" 
                    required
                >
            </div>
            
            <button type="submit">Convert to APK</button>
        </form>
        
        <div class="loader" id="loader">
            <div class="spinning-circle"></div>
            <p>Processing your request...</p>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <div class="visualization">
        <h3 class="visualization-title">How It Works</h3>
        <div class="process-flow">
            <div class="connecting-line"></div>
            <div class="process-step">
                <div class="step-icon">🌐</div>
                <div class="step-label">Website</div>
            </div>
            <div class="process-step">
                <div class="step-icon">🔄</div>
                <div class="step-label">Conversion</div>
            </div>
            <div class="process-step">
                <div class="step-icon">⚙️</div>
                <div class="step-label">GitHub Actions</div>
            </div>
            <div class="process-step">
                <div class="step-icon">📦</div>
                <div class="step-label">APK Artifact</div>
            </div>
            <div class="process-step">
                <div class="step-icon">📱</div>
                <div class="step-label">Mobile App</div>
            </div>
        </div>
        <div class="floating-dots" id="floatingDots"></div>
    </div>

    <script>
        // Create floating dots
        const floatingDots = document.getElementById('floatingDots');
        for (let i = 0; i < 20; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.left = `${Math.random() * 100}%`;
            dot.style.top = `${Math.random() * 100}%`;
            dot.style.animationDelay = `${Math.random() * 4}s`;
            floatingDots.appendChild(dot);
        }

        document.getElementById('convertForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const package_name = document.getElementById('packageName').value;
            const secret = document.getElementById('secret').value;
            
            // Show loader
            document.getElementById('loader').style.display = 'block';
            document.getElementById('status').style.display = 'none';
            
            try {
                const response = await fetch('https://wtm-46fs.onrender.com/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url,
                        package_name,
                        secret
                    })
                });
                
                // Hide loader
                document.getElementById('loader').style.display = 'none';
                
                // Show status
                const statusElement = document.getElementById('status');
                statusElement.style.display = 'block';
                
                if (response.ok) {
                    statusElement.className = 'status success';
                    statusElement.textContent = 'Your APK has been generated successfully.';
                } else {
                    const result = await response.json();
                    statusElement.className = 'status error';
                    statusElement.textContent = result.message || 'Something went wrong. Please try again.';
                }
            } catch (error) {
                // Hide loader
                document.getElementById('loader').style.display = 'none';
                
                // Show error
                const statusElement = document.getElementById('status');
                statusElement.style.display = 'block';
                statusElement.className = 'status error';
                statusElement.textContent = error.message || 'Connection failed. Please check your internet and try again.';
            }
        });
    </script>
</body>
</html>
